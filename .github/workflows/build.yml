name: Build Nuxt Frontend

on:
  push:
    branches:
      - main
    paths:
      - "PMUUI/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build Nuxt & publish to nuxt-build branch
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd PMUUI
          npm install --no-audit --no-fund

      - name: Generate
        run: |
          cd PMUUI
          npm run generate

      - name: Verify build output
        run: test -f PMUUI/.output/public/index.html

      - name: Publish to nuxt-build branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan nuxt-build
          git rm -rf . || true
          cp -a PMUUI/.output/public/. ./
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Nuxt frontend (commit ${{ github.sha }})"
            git push origin nuxt-build --force
          fi