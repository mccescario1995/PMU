name: Build Nuxt Frontend

on:
  push:
    branches:
      - main
    paths:
      - "PMUUI/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Nuxt & publish to nuxt-build branch
    runs-on: ubuntu-latest  # GitHub Actions has ~7GB RAM, unlike Hostinger shared hosting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (PMUUI)
        run: |
          cd PMUUI
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Nuxt frontend
        run: |
          cd PMUUI
          npm run generate

      - name: Verify build output
        run: |
          test -f PMUUI/.output/public/index.html

      - name: Publish built frontend to nuxt-build branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git for the push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch (no history) for the build output
          git checkout --orphan nuxt-build
          git rm -rf . || true

          # Copy only the built frontend
          cp -a PMUUI/.output/public/. ./

          # Stage everything
          git add -A

          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Nuxt frontend (commit ${{ github.sha }})"
            git push origin nuxt-build --force
          fi