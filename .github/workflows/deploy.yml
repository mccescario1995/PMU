name: Deploy PMU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            WEB_ROOT='${{ secrets.HOSTINGER_PUBLIC_HTML }}'
            APP_ROOT='${{ secrets.HOSTINGER_APP_ROOT }}'
            REPOSITORY='${{ secrets.HOSTINGER_GITHUB_REPO }}'
            BRANCH='main'

            # Keep the Git repository outside the public web root.
            mkdir -p "$APP_ROOT"
            if [ ! -d "$APP_ROOT/.git" ]; then
              git clone --branch "$BRANCH" --single-branch "$REPOSITORY" "$APP_ROOT"
            else
              git -C "$APP_ROOT" fetch --prune origin "$BRANCH"
              git -C "$APP_ROOT" reset --hard "origin/$BRANCH"
              git -C "$APP_ROOT" clean -fd
            fi

            # Laravel backend
            cd "$APP_ROOT/PMUAPI"
            test -f artisan
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Nuxt static frontend
            export NVM_DIR="$HOME/.nvm"
            
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not available in this SSH environment."
              exit 127
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is not available in this SSH environment."
              exit 127
            fi

            node --version
            npm --version

            cd "$APP_ROOT/PMUUI"
            test -f package.json
            npm ci
            npm run generate
            test -f .output/public/index.html

            # Publish Nuxt without deleting /api.
            mkdir -p "$WEB_ROOT"
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name api ! -name .well-known -exec rm -rf {} +
            cp -a .output/public/. "$WEB_ROOT/"

            # Publish Laravel public assets under /api.
            rm -rf "$WEB_ROOT/api"
            mkdir -p "$WEB_ROOT/api"
            cp -a "$APP_ROOT/PMUAPI/public/." "$WEB_ROOT/api/"

            # Use a wrapper so Laravel resolves vendor/bootstrap from APP_ROOT.
            cat > "$WEB_ROOT/api/index.php" <<PHP
            <?php
            require '$APP_ROOT/PMUAPI/public/index.php';
            PHP

            cat > "$WEB_ROOT/api/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteBase /api/
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule ^ index.php [L]
            </IfModule>
            HTACCESS

            test -f "$WEB_ROOT/index.html"
            test -f "$WEB_ROOT/api/index.php"
            test -d "$WEB_ROOT/_nuxt"
            echo 'Deployment completed successfully.'