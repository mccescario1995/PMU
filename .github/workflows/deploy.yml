name: Deploy PMU to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy-pmuapi:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy PMUAPI
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |

            set -e

            echo "================================="
            echo "Deploying PMUAPI"
            echo "================================="

            DEPLOY_PATH="${{ secrets.HOSTINGER_PMUAPI_DEPLOY_PATH }}"

            mkdir -p "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then

              echo "First deployment..."

              git init

              git remote add origin "${{ secrets.HOSTINGER_GITHUB_REPO }}"

              git sparse-checkout init --cone

              git sparse-checkout set PMUAPI

              git fetch origin main

              git checkout -B main origin/main

            else

              echo "Updating repository..."

              git fetch origin main

              git reset --hard origin/main

            fi

            cd "$DEPLOY_PATH/PMUAPI"

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            php artisan migrate --force --no-interaction

            php artisan optimize:clear

            php artisan config:cache

            php artisan route:cache

            php artisan view:cache

            echo "PMUAPI deployment completed!"


  deploy-pmui:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy PMUUI
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |

            set -e

            echo "================================="
            echo "Deploying PMUUI"
            echo "================================="

            DEPLOY_PATH="${{ secrets.HOSTINGER_PMUUI_DEPLOY_PATH }}"

            mkdir -p "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then

              echo "First deployment..."

              git init

              git remote add origin "${{ secrets.HOSTINGER_GITHUB_REPO }}"

              git sparse-checkout init --cone

              git sparse-checkout set PMUUI

              git fetch origin main

              git checkout -B main origin/main

            else

              echo "Updating repository..."

              git fetch origin main

              git reset --hard origin/main

            fi

            cd "$DEPLOY_PATH/PMUUI"

            npm ci

            npm run build

            pkill -f "nuxt start" || true

            nohup npx nuxt start \ > storage/logs/nuxt.log 2>&1 &

            echo "PMUUI deployment completed!"