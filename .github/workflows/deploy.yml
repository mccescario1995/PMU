name: Deploy PMU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            trap 'status=$?; echo "FAILED at line $LINENO: $BASH_COMMAND (exit code $status)"; exit "$status"' ERR

            WEB_ROOT='${{ secrets.HOSTINGER_PUBLIC_HTML }}'
            APP_ROOT="$HOME/apps/pmu"
            REPOSITORY='${{ secrets.HOSTINGER_GITHUB_REPO }}'
            BRANCH='main'

            echo "Starting deployment..."
            echo "Home directory: $HOME"
            echo "Web root: $WEB_ROOT"
            echo "Application root: $APP_ROOT"

            echo "Checking required server commands..."
            command -v git
            command -v php
            command -v composer
            php --version | head -n 1
            composer --version | head -n 1

            echo "Preparing repository..."

            echo "Checking home directory permissions..."
            id
            ls -ld "$HOME"

            echo "Creating application directory..."
            mkdir -pv "$HOME/apps" || {
              echo "Cannot create $HOME/apps"
              exit 1
            }

            mkdir -pv "$HOME/apps/pmu" || {
              echo "Cannot create $HOME/apps/pmu"
              exit 1
            }

            APP_ROOT="$HOME/apps/pmu"

            echo "Checking application directory..."
            ls -ld "$APP_ROOT"
            test -d "$APP_ROOT" || {
              echo "Application directory does not exist: $APP_ROOT"
              exit 1
            }

            echo "Testing write access..."

            TEST_FILE="$APP_ROOT/.deployment-test.$$"

            if ! (umask 077 && printf 'deployment test\n' > "$TEST_FILE"); then
              echo "Cannot write to $APP_ROOT"
              exit 1
            fi

            echo "Write test succeeded"

            if ! rm -f -- "$TEST_FILE"; then
              echo "Cannot remove temporary test file: $TEST_FILE"
              exit 1
            fi

            echo "Write test cleanup succeeded"

            echo "Contents of application directory:"
            ls -la "$APP_ROOT"

            if [ -d "$APP_ROOT/.git" ]; then
              echo "Existing Git repository found; updating..."
              git -C "$APP_ROOT" fetch --prune origin "$BRANCH"
              git -C "$APP_ROOT" reset --hard "origin/$BRANCH"
              git -C "$APP_ROOT" clean -fd
            else
              echo "No Git repository found."

              if find "$APP_ROOT" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                echo "Application directory is not empty and is not a Git repository."
                echo "Move or remove its existing contents before cloning."
                exit 1
              fi

              echo "Cloning repository..."
              git clone --branch "$BRANCH" --single-branch "$REPOSITORY" "$APP_ROOT"
            fi

            if [ ! -d "$APP_ROOT/.git" ]; then
              echo "Cloning repository..."
              git clone --branch "$BRANCH" --single-branch "$REPOSITORY" "$APP_ROOT"
            else
              echo "Updating repository..."
              git -C "$APP_ROOT" fetch --prune origin "$BRANCH"
              git -C "$APP_ROOT" reset --hard "origin/$BRANCH"
              git -C "$APP_ROOT" clean -fd
            fi

            echo "Checking repository structure..."
            git -C "$APP_ROOT" rev-parse --short HEAD
            test -d "$APP_ROOT/PMUAPI" || { echo "Missing PMUAPI directory"; exit 1; }
            test -d "$APP_ROOT/PMUUI" || { echo "Missing PMUUI directory"; exit 1; }
            test -f "$APP_ROOT/PMUAPI/artisan" || { echo "Missing Laravel artisan file"; exit 1; }
            test -f "$APP_ROOT/PMUAPI/composer.json" || { echo "Missing Laravel composer.json"; exit 1; }
            test -f "$APP_ROOT/PMUUI/package.json" || { echo "Missing Nuxt package.json"; exit 1; }
            test -f "$APP_ROOT/PMUUI/package-lock.json" || { echo "Missing Nuxt package-lock.json; run npm install locally and commit it"; exit 1; }

            echo "Deploying Laravel..."
            cd "$APP_ROOT/PMUAPI"
            test -f .env || { echo "Missing Laravel .env at $APP_ROOT/PMUAPI/.env"; exit 1; }
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Loading Node.js..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            command -v node || { echo "Node.js is not available in this SSH environment"; exit 127; }
            command -v npm || { echo "npm is not available in this SSH environment"; exit 127; }
            node --version
            npm --version

            echo "Building Nuxt..."
            cd "$APP_ROOT/PMUUI"
            npm ci
            npm run generate
            test -f .output/public/index.html || { echo "Nuxt output was not generated"; exit 1; }

            echo "Publishing Nuxt frontend..."
            mkdir -p "$WEB_ROOT"
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name api \
              ! -name .well-known \
              -exec rm -rf {} +
            cp -a .output/public/. "$WEB_ROOT/"

            echo "Publishing Laravel API..."
            rm -rf "$WEB_ROOT/api"
            mkdir -p "$WEB_ROOT/api"
            cp -a "$APP_ROOT/PMUAPI/public/." "$WEB_ROOT/api/"

            # This wrapper keeps Laravel's vendor and bootstrap directories private.
            cat > "$WEB_ROOT/api/index.php" <<PHP
            <?php
            require '$APP_ROOT/PMUAPI/public/index.php';
            PHP

            cat > "$WEB_ROOT/api/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteBase /api/
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule ^ index.php [L]
            </IfModule>
            HTACCESS

            echo "Running final checks..."
            test -f "$WEB_ROOT/index.html"
            test -f "$WEB_ROOT/api/index.php"
            test -d "$WEB_ROOT/_nuxt"
            echo "Deployment completed successfully."
