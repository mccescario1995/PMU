name: Deploy PMU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            trap 'status=$?; echo "FAILED at line $LINENO: $BASH_COMMAND (exit code $status)"; exit "$status"' ERR

            WEB_ROOT='${{ secrets.HOSTINGER_PUBLIC_HTML }}'
            APP_ROOT="$HOME/apps/pmu"
            REPOSITORY='${{ secrets.HOSTINGER_GITHUB_REPO }}'
            BRANCH='main'

            echo "Starting deployment..."
            echo "Home directory: $HOME"
            echo "Web root: $WEB_ROOT"
            echo "Application root: $APP_ROOT"

            echo "Checking required server commands..."
            command -v git
            command -v php
            command -v composer
            php --version | head -n 1
            composer --version | head -n 1

            echo "Preparing application directory..."
            mkdir -pv "$HOME/apps"
            mkdir -pv "$APP_ROOT"
            test -d "$APP_ROOT"

            echo "Testing write access..."
            TEST_FILE="$APP_ROOT/.deployment-test.$$"
            if ! (umask 077 && printf 'deployment test\n' > "$TEST_FILE"); then
              echo "Cannot write to $APP_ROOT"
              exit 1
            fi
            rm -f -- "$TEST_FILE"

            echo "Synchronizing repository..."
            if [ -d "$APP_ROOT/.git" ]; then
              echo "Existing Git repository found; updating..."
              git -C "$APP_ROOT" fetch --prune origin "$BRANCH"
              git -C "$APP_ROOT" reset --hard "origin/$BRANCH"
              echo "Repository reset completed."
              git -C "$APP_ROOT" status --short
            else
              echo "No Git repository found."
              if find "$APP_ROOT" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                echo "Application directory is not empty and is not a Git repository."
                ls -la "$APP_ROOT"
                exit 1
              fi
              echo "Cloning repository..."
              git clone --branch "$BRANCH" --single-branch "$REPOSITORY" "$APP_ROOT"
            fi

            echo "Checking repository structure..."
            git -C "$APP_ROOT" rev-parse --short HEAD
            test -d "$APP_ROOT/PMUAPI" || { echo "Missing PMUAPI directory"; exit 1; }
            test -d "$APP_ROOT/PMUUI" || { echo "Missing PMUUI directory"; exit 1; }
            test -f "$APP_ROOT/PMUAPI/artisan" || { echo "Missing Laravel artisan file"; exit 1; }
            test -f "$APP_ROOT/PMUAPI/composer.json" || { echo "Missing Laravel composer.json"; exit 1; }
            test -f "$APP_ROOT/PMUUI/package.json" || { echo "Missing Nuxt package.json"; exit 1; }
            test -f "$APP_ROOT/PMUUI/package-lock.json" || { echo "Missing Nuxt package-lock.json"; exit 1; }

            echo "Checking Laravel environment file..."
            ENV_FILE="$APP_ROOT/PMUAPI/.env"
            ENV_EXAMPLE="$APP_ROOT/PMUAPI/.env.example"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Production .env does not exist."
              test -f "$ENV_EXAMPLE" || {
                echo "Missing .env.example"
                exit 1
              }
              cp "$ENV_EXAMPLE" "$ENV_FILE"
              chmod 600 "$ENV_FILE"
              echo "Created $ENV_FILE from .env.example."
              echo "Set APP_ENV, APP_DEBUG, APP_URL, APP_KEY, and database values, then rerun the workflow."
              exit 1
            fi

            chmod 600 "$ENV_FILE"
            grep -q '^APP_KEY=.' "$ENV_FILE" || {
              echo "APP_KEY is missing or empty in $ENV_FILE"
              exit 1
            }
            grep -q '^DB_DATABASE=.' "$ENV_FILE" || {
              echo "DB_DATABASE is missing or empty in $ENV_FILE"
              exit 1
            }
            grep -q '^DB_USERNAME=.' "$ENV_FILE" || {
              echo "DB_USERNAME is missing or empty in $ENV_FILE"
              exit 1
            }

            echo "Deploying Laravel..."
            cd "$APP_ROOT/PMUAPI"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Loading Node.js..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            command -v node || { echo "Node.js is not available"; exit 127; }
            command -v npm || { echo "npm is not available"; exit 127; }
            node --version
            npm --version

            echo "Building Nuxt..."
            cd "$APP_ROOT/PMUUI"
            npm ci
            npm run generate
            test -f .output/public/index.html || { echo "Nuxt output was not generated"; exit 1; }

            echo "Publishing Nuxt frontend..."
            mkdir -p "$WEB_ROOT"
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name api \
              ! -name .well-known \
              -exec rm -rf {} +
            cp -a .output/public/. "$WEB_ROOT/"

            echo "Publishing Laravel API..."
            rm -rf "$WEB_ROOT/api"
            mkdir -p "$WEB_ROOT/api"
            cp -a "$APP_ROOT/PMUAPI/public/." "$WEB_ROOT/api/"

            printf '%s\n' \
              '<?php' \
              "require '$APP_ROOT/PMUAPI/public/index.php';" \
              > "$WEB_ROOT/api/index.php"

            printf '%s\n' \
              '<IfModule mod_rewrite.c>' \
              '    RewriteEngine On' \
              '    RewriteBase /api/' \
              '    RewriteCond %{REQUEST_FILENAME} !-f' \
              '    RewriteCond %{REQUEST_FILENAME} !-d' \
              '    RewriteRule ^ index.php [L]' \
              '</IfModule>' \
              > "$WEB_ROOT/api/.htaccess"

            echo "Running final checks..."
            test -f "$WEB_ROOT/index.html"
            test -f "$WEB_ROOT/api/index.php"
            test -f "$WEB_ROOT/api/.htaccess"
            test -d "$WEB_ROOT/_nuxt"
            echo "Deployment completed successfully."