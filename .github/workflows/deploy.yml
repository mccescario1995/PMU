name: Deploy PMU to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy-pmuapi:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy PMUAPI
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |

            set -e

            echo "================================="
            echo "Deploying PMUAPI"
            echo "================================="

            DEPLOY_PATH="${{ secrets.HOSTINGER_PMUAPI_DEPLOY_PATH }}"

            mkdir -p "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then

              echo "First deployment..."

              git init

              git remote add origin "${{ secrets.HOSTINGER_GITHUB_REPO }}"

              git sparse-checkout init --cone

              git sparse-checkout set PMUAPI

              git fetch origin main

              git checkout -B main origin/main

            else

              echo "Updating repository..."

              git fetch origin main

              git reset --hard origin/main

            fi

            cd "$DEPLOY_PATH/PMUAPI"

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            php artisan migrate --force --no-interaction

            php artisan optimize:clear

            php artisan config:cache

            php artisan route:cache

            php artisan view:cache

            echo "PMUAPI deployment completed!"


  deploy-pmui:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy PMUUI
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            set -e

            echo "================================="
            echo "Deploying PMUUI"
            echo "================================="

            DEPLOY_PATH="${{ secrets.HOSTINGER_PMUUI_DEPLOY_PATH }}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then
              echo "First deployment..."

              git init

              git remote add origin "${{ secrets.HOSTINGER_GITHUB_REPO }}"

              git sparse-checkout init --cone
              git sparse-checkout set PMUUI

              git fetch origin main
              git checkout -B main origin/main

            else
              echo "Updating repository..."

              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$DEPLOY_PATH/PMUUI"

            echo "Loading NVM..."

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "Installing npm dependencies..."

            npm ci

            echo "Building Nuxt SPA..."
            npm run generate

            WEB_ROOT="${{ secrets.HOSTINGER_PMUUI_WEB_ROOT }}"
            if [ -z "$WEB_ROOT" ]; then
              WEB_ROOT="$DEPLOY_PATH"
            fi

            echo "Deploying static files to web root: $WEB_ROOT"
            mkdir -p "$WEB_ROOT"
            cp -r .output/public/* "$WEB_ROOT/"

            echo "Creating .htaccess (SPA fallback + API routing)..."
            cat > "$WEB_ROOT/.htaccess" << 'HTACCESS'
            <IfModule mod_rewrite.c>
                RewriteEngine On

                # Route /api/ requests to Laravel backend
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteRule ^api/(.*) index.php [L,QSA]

                # SPA fallback: serve index.html for all non-file routes
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteRule ^ /index.html [L]
            </IfModule>
            HTACCESS

            echo "PMUUI deployment completed!"