name: Deploy PMU to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy PMU
        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.HOSTINGER_HOST }}

          username: ${{ secrets.HOSTINGER_USERNAME }}

          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          port: ${{ secrets.HOSTINGER_PORT }}

          script: |

            set -e


            echo "=========================================="
            echo "        PMU DEPLOYMENT"
            echo "=========================================="


            # ==================================================
            # PATHS
            # ==================================================

            WEB_ROOT="${{ secrets.HOSTINGER_PUBLIC_HTML }}"

            echo "Web root:"
            echo "$WEB_ROOT"

            mkdir -p "$WEB_ROOT"

            cd "$WEB_ROOT"


            # ==================================================
            # UPDATE GITHUB REPOSITORY
            # ==================================================

            echo "=========================================="
            echo "Updating Git repository"
            echo "=========================================="


            if [ ! -d ".git" ]; then

                echo "First deployment..."

                git init

                git remote add origin "${{ secrets.HOSTINGER_GITHUB_REPO }}"

                git fetch origin main

                git checkout -B main origin/main

            else

                echo "Updating repository..."

                git fetch origin main

                git reset --hard origin/main

            fi


            # ==================================================
            # LARAVEL API
            # ==================================================

            echo "=========================================="
            echo "Deploying PMUAPI"
            echo "=========================================="


            cd "$WEB_ROOT/PMUAPI"


            echo "PHP version:"

            php -v


            echo "Composer version:"

            composer --version


            echo "Installing Laravel dependencies..."

            composer install \
                --no-dev \
                --optimize-autoloader \
                --no-interaction


            echo "Running migrations..."

            php artisan migrate \
                --force \
                --no-interaction


            echo "Clearing Laravel cache..."

            php artisan optimize:clear


            echo "Rebuilding Laravel cache..."

            php artisan config:cache

            php artisan route:cache

            php artisan view:cache


            echo "PMUAPI deployment completed!"


            # ==================================================
            # NUXT UI
            # ==================================================

            echo "=========================================="
            echo "Deploying PMUUI"
            echo "=========================================="


            cd "$WEB_ROOT/PMUUI"


            # ==================================================
            # LOAD NVM
            # ==================================================

            echo "Loading Node.js..."

            export NVM_DIR="$HOME/.nvm"


            if [ -s "$NVM_DIR/nvm.sh" ]; then

                source "$NVM_DIR/nvm.sh"

            fi


            echo "Node version:"

            node -v


            echo "NPM version:"

            npm -v


            # ==================================================
            # INSTALL NPM DEPENDENCIES
            # ==================================================

            echo "Installing npm dependencies..."

            npm ci


            # ==================================================
            # GENERATE NUXT SPA
            # ==================================================

            echo "Generating Nuxt SPA..."

            npm run generate


            # ==================================================
            # DEPLOY NUXT STATIC FILES
            # ==================================================

            echo "=========================================="
            echo "Publishing Nuxt"
            echo "=========================================="


            cd "$WEB_ROOT"


            echo "Removing previous Nuxt build..."

            rm -rf _nuxt

            rm -f index.html


            echo "Copying new Nuxt build..."

            cp -r "$WEB_ROOT/PMUUI/.output/public/." "$WEB_ROOT/"


            echo "PMUUI deployment completed!"


            # ==================================================
            # VERIFY
            # ==================================================

            echo "=========================================="
            echo "Verifying deployment"
            echo "=========================================="


            test -f "$WEB_ROOT/index.html"

            test -f "$WEB_ROOT/PMUAPI/public/index.php"

            test -d "$WEB_ROOT/_nuxt"


            echo "Nuxt index.html: OK"

            echo "Laravel index.php: OK"

            echo "Nuxt _nuxt directory: OK"


            echo "=========================================="
            echo "PMU DEPLOYMENT SUCCESSFUL"
            echo "=========================================="